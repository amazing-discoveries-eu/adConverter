name: Release
on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

jobs:
    release:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: 'macos-latest'
                      args: '--target aarch64-apple-darwin'
                    - platform: 'macos-latest'
                      args: '--target x86_64-apple-darwin'
                    - platform: 'ubuntu-22.04'
                      args: ''
                      cli-target: x86_64-unknown-linux-gnu
                    - platform: 'windows-latest'
                      args: ''
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v6

            - name: setup node
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: install dependencies (ubuntu only)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Require signing key for desktop RPM (Linux)
              if: runner.os == 'Linux'
              shell: bash
              env:
                  TAURI_SIGNING_RPM_KEY: ${{ secrets.TAURI_SIGNING_RPM_KEY }}
              run: |
                  if [[ -z "$TAURI_SIGNING_RPM_KEY" ]]; then
                      echo "::error::Missing TAURI_SIGNING_RPM_KEY. The desktop RPM must be signed before publication."
                      exit 1
                  fi

            - name: Install CLI packaging tools (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get install -y ruby ruby-dev build-essential rpm dpkg-dev
                  sudo gem install --no-document fpm -v 1.18.0

            - name: install frontend dependencies
              run: npm ci

            - name: Prepare Apple API key
              if: runner.os == 'macOS'
              shell: bash
              env:
                  APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ vars.APPLE_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  if [[ -z "$APPLE_API_PRIVATE_KEY" || -z "$APPLE_API_KEY" || -z "$APPLE_API_ISSUER" ]]; then
                      echo "::error::Missing APPLE_API_PRIVATE_KEY, APPLE_API_KEY_ID or APPLE_ISSUER_ID."
                      exit 1
                  fi
                  key_path="$RUNNER_TEMP/adconverter-apple-api-key.p8"
                  umask 077
                  printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
                  echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

            - name: Build the app
              id: build_app
              uses: tauri-apps/tauri-action@v1

              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
                  TAURI_SIGNING_RPM_KEY: ${{ runner.os == 'Linux' && secrets.TAURI_SIGNING_RPM_KEY || '' }}
                  TAURI_SIGNING_RPM_KEY_PASSPHRASE: ${{ runner.os == 'Linux' && secrets.TAURI_SIGNING_RPM_KEY_PASSPHRASE || '' }}
                  APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
                  APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
                  APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
                  APPLE_API_ISSUER: ${{ runner.os == 'macOS' && vars.APPLE_ISSUER_ID || '' }}

              with:
                  tagName: v__VERSION__
                  releaseName: 'adConverter v__VERSION__'
                  releaseBody: 'See the assets to download this version and install.'
                  releaseDraft: true
                  prerelease: false
                  retryAttempts: 2
                  args: ${{ matrix.args }} -- --locked

            - name: Build standalone Linux CLI
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  set -euo pipefail
                  cargo build --locked --release --no-default-features --manifest-path src-tauri/Cargo.toml --bin adConverter-cli --target-dir src-tauri/target/cli
                  cargo tree --locked --no-default-features --manifest-path src-tauri/Cargo.toml --prefix none > "$RUNNER_TEMP/cli-dependencies.txt"
                  python3 - "$RUNNER_TEMP/cli-dependencies.txt" <<'PY'
                  from pathlib import Path
                  import sys
                  for line in Path(sys.argv[1]).read_text().splitlines():
                      name = line.split()[0]
                      if name.startswith(("tauri", "gtk", "gdk", "webkit", "javascriptcore", "soup")):
                          sys.exit(f"Desktop dependency in standalone CLI: {name}")
                  PY

            - name: Package standalone Linux CLI
              if: runner.os == 'Linux'
              id: package_cli
              shell: bash
              env:
                  CLI_TARGET: ${{ matrix.cli-target }}
                  APP_VERSION: ${{ steps.build_app.outputs.appVersion }}
              run: python3 scripts/package-cli.py

            - name: Verify Linux CLI packages and first startup
              if: runner.os == 'Linux'
              shell: bash
              env:
                  CLI_PACKAGE_DIR: ${{ steps.package_cli.outputs.directory }}
              run: |
                  set -euo pipefail
                  smoke_root="$RUNNER_TEMP/cli-smoke"
                  dpkg-deb --info "$CLI_PACKAGE_DIR"/*.deb
                  dpkg-deb --extract "$CLI_PACKAGE_DIR"/*.deb "$smoke_root"
                  XDG_DATA_HOME="$smoke_root/user-data" "$smoke_root/usr/bin/adconverter-cli" --help
                  test -s "$smoke_root/user-data/com.adconverter/config.json"
                  test -s "$smoke_root/user-data/com.adconverter/presets/mp3.json"
                  test -s "$smoke_root/user-data/com.adconverter/scripts/transcript_cli.py"
                  rpm -qpl "$CLI_PACKAGE_DIR"/*.rpm > "$RUNNER_TEMP/cli-rpm-files.txt"
                  python3 - "$RUNNER_TEMP/cli-rpm-files.txt" <<'PY'
                  from pathlib import Path
                  import sys
                  files = Path(sys.argv[1]).read_text().splitlines()
                  for required in [
                      "/usr/bin/adconverter-cli",
                      "/usr/share/adconverter-cli/assets/config.json",
                      "/usr/share/adconverter-cli/assets/presets/mp3.json",
                      "/usr/share/adconverter-cli/assets/scripts/transcript_cli.py",
                  ]:
                      if required not in files:
                          sys.exit(f"Missing RPM file: {required}")
                  PY

            - name: Upload standalone CLI to release
              if: runner.os == 'Linux'
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APP_VERSION: ${{ steps.build_app.outputs.appVersion }}
                  CLI_PACKAGE_DIR: ${{ steps.package_cli.outputs.directory }}
              run: gh release upload "v$APP_VERSION" "$CLI_PACKAGE_DIR"/* --repo "$GITHUB_REPOSITORY" --clobber

            - name: Remove Apple API key
              if: always() && runner.os == 'macOS'
              shell: bash
              run: rm -f "$RUNNER_TEMP/adconverter-apple-api-key.p8"
