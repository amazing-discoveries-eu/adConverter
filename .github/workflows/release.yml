name: Release
on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

jobs:
    release:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: 'macos-latest'
                      args: '--target aarch64-apple-darwin'
                    - platform: 'macos-latest'
                      args: '--target x86_64-apple-darwin'
                    - platform: 'ubuntu-22.04'
                      args: ''
                    - platform: 'windows-latest'
                      args: ''
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v6

            - name: setup node
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: install dependencies (ubuntu only)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: install frontend dependencies
              run: npm install

            - name: Prepare Apple API key
              if: runner.os == 'macOS'
              shell: bash
              env:
                  APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ vars.APPLE_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  if [[ -z "$APPLE_API_PRIVATE_KEY" || -z "$APPLE_API_KEY" || -z "$APPLE_API_ISSUER" ]]; then
                      echo "::error::Missing APPLE_API_PRIVATE_KEY, APPLE_API_KEY_ID or APPLE_ISSUER_ID."
                      exit 1
                  fi
                  key_path="$RUNNER_TEMP/adconverter-apple-api-key.p8"
                  umask 077
                  printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
                  echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

            - name: Build the app
              uses: tauri-apps/tauri-action@v1

              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
                  APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
                  APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
                  APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
                  APPLE_API_ISSUER: ${{ runner.os == 'macOS' && vars.APPLE_ISSUER_ID || '' }}

              with:
                  tagName: v__VERSION__
                  releaseName: 'adConverter v__VERSION__'
                  releaseBody: 'See the assets to download this version and install.'
                  releaseDraft: true
                  prerelease: false
                  retryAttempts: 2
                  args: ${{ matrix.args }}

            - name: Remove Apple API key
              if: always() && runner.os == 'macOS'
              shell: bash
              run: rm -f "$RUNNER_TEMP/adconverter-apple-api-key.p8"
