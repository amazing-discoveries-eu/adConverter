[package]
name = "adConverter"
version = "0.17.1"
description = "Batch/Preset converter based on ffmpeg."
authors = ["Jonathan Baecker <jonbae77@gmail.com>"]
edition = "2024"
autobins = false
default-run = "adConverter"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "adconverter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "adConverter"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "adConverter-cli"
path = "src/bin/adConverter-cli.rs"

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-http",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-store",
    "dep:tauri-plugin-cli",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-window-state",
    "dep:async-walkdir",
    "dep:system_shutdown",
    "dep:tokio-stream",
]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [], optional = true }

[dependencies]
async-walkdir = { version = "2.2.0", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
dirs = "7.0.0"
flexi_logger = { version = "0.31.10", features = ["kv", "colors"] }
indicatif = "0.18.6"
inquire = "0.9.5"
log = { version = "0.4.35", features = ["std", "serde", "kv", "kv_std", "kv_sval", "kv_serde"] }
num-traits = "0.2.19"
path-clean = "1.0.1"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
shlex = "2.0.1"
system_shutdown = { version = "4.1.0", optional = true }
tauri = { version = "2.12.6", features = ["tray-icon", "unstable"], optional = true }
tauri-plugin-clipboard-manager = { version = "2.5.0", optional = true }
tauri-plugin-dialog = { version = "2.8.4", optional = true }
tauri-plugin-http = { version = "2.9.0", features = ["multipart"], optional = true }
tauri-plugin-shell = { version = "2.6.0", optional = true }
tauri-plugin-store = { version = "2.5.1", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", optional = true }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "no-serde-warnings", "serde-json-impl"] }
unicode-script = "0.5.9"

[profile.release]
opt-level = 3
strip = true
lto = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = { version = "2.5.0", optional = true }
tauri-plugin-updater = { version = "2.14.1", optional = true }
tauri-plugin-window-state = { version = "2.5.0", optional = true }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
semicolon_if_nothing_returned = "warn"
if_not_else = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
redundant_else = "warn"

[lints]
workspace = true
