[package]
name = "adConverter"
version = "0.17.1"
description = "Batch/Preset converter based on ffmpeg."
authors = ["Jonathan Baecker <jonbae77@gmail.com>"]
edition = "2024"
autobins = false
default-run = "adConverter"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "adconverter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "adConverter"
path = "src/main.rs"

[[bin]]
name = "adConverter-cli"
path = "src/bin/adConverter-cli.rs"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
async-stream = "0.3.6"
async-walkdir = "2.2.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
dirs = "7.0.0"
flexi_logger = { version = "0.31.10", features = ["kv", "colors"] }
indicatif = "0.18.6"
inquire = "0.9.5"
log = { version = "0.4.35", features = ["std", "serde", "kv", "kv_std", "kv_sval", "kv_serde"] }
num-traits = "0.2.19"
path-clean = "1.0.1"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
shlex = "2.0.1"
system_shutdown = "4.1.0"
tauri = { version = "2.12.6", features = ["tray-icon", "unstable"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-http = { version = "2.9.0", features = ["multipart"] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-store = "2.5.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "no-serde-warnings", "serde-json-impl"] }
unicode-script = "0.5.9"

[profile.release]
opt-level = 3
strip = true
lto = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2.5.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2.5.0"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
semicolon_if_nothing_returned = "warn"
if_not_else = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
redundant_else = "warn"
